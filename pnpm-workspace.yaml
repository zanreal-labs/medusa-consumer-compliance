# pnpm 11 refuses to run a dependency's build scripts unless it is listed here.
# These are the native builds a Medusa install performs anyway.
allowBuilds:
  "@medusajs/telemetry": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
# typescript-eslint needs the TypeScript 6 JS API, which TypeScript 7 does not ship,
# so its typescript peer must not resolve to the root typescript 7.
